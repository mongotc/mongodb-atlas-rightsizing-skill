# MongoDB Atlas rightsizing — tunable thresholds.
#
# Adjust to your risk tolerance. A user optimizing hard for cost will want
# lower scale-down bars; a user for whom latency or incidents matter most
# wants lower scale-up bars.
#
# Rationale:
#   - mongod cluster thresholds: see references/mongod-thresholds.md
#   - Atlas Search thresholds:   see references/search-thresholds.md
#     (user-supplied; the values below are placeholders borrowed from mongod)
#
# Atlas facts (per-tier connection limits, shared-tier list) live in
# src/constants/tiers.py — not here, since they're not tolerance knobs.

# ---- mongod thresholds ----------------------------------------------------

cpu:          { up_pct: 80,   down_pct: 20 }         # p95 CPU user+kernel; up is sustained
memory:       { free_up_pct: 10, free_down_pct: 40 } # p5 free memory / (free+used)
iops:         { up_fraction: 0.90, down_fraction: 0.50 }  # of provisioned IOPS (read+write)
disk_space:   { up_pct: 90,   down_pct: 50 }         # of capacity; up is sustained
disk_latency: { up_ms: 15,    down_ms: 5 }           # heuristic
connections:  { up_fraction: 0.80, down_fraction: 0.30 }  # of tier limit (from constants/tiers.py)
page_faults:  { up_per_sec: 1.0, down_per_sec: 0.5 }      # heuristic
cache_fill:   { up_pct: 80,   down_pct: 50 }         # WT eviction_target
dirty_fill:   { up_pct: 5,    down_pct: 2 }          # WT eviction_dirty_target

sustained_days: 3      # CPU/IOPS/disk-space must fire on >= N of last 7 days
near_threshold: 0.10   # p95 within 10% of a trigger = borderline
min_coverage:   0.90   # below this fraction of expected samples, data has gaps
iowait_context_pct: 5  # iowait shown alongside disk-latency triggers when p95 > this

# ---- Atlas Search (mongot) thresholds -------------------------------------
# PLACEHOLDER values, borrowed from mongod. Replace once
# references/search-thresholds.md lands with rationale for what "high" and
# "low" mean for a bursty Search Node.

search:
  cpu:    { up_pct: 80, down_pct: 20 }         # per-Search-Node SYSTEM_NORMALIZED_CPU_*
  memory: { free_up_pct: 10, free_down_pct: 40 } # per-Search-Node SYSTEM_MEMORY_*
